<!DOCTYPE html>
<html>
<head>
  <title>OptiCore Pro</title>

  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <h1>⚡ OPTICORE PRO</h1>
  <p class="sub">Cyber System Optimization Simulator</p>

  <div class="panel">

    <p>CPU: <span id="cpu">65</span>%</p>
    <p>RAM: <span id="ram">70</span>%</p>
    <p>DISK: <span id="disk">75</span>%</p>

    <button onclick="boost()">Boost System</button>
    <button onclick="clean()">Clean System</button>
    <button onclick="analyze()">AI Analyze</button>

  </div>

  <div class="panel">
    <h3>AI Assistant</h3>
    <div id="ai">Ready...</div>
  </div>

  <div class="terminal" id="log"></div>

</div>

<script src="script.js"></script>

</body>
</html>
